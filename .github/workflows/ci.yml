name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn --batch-mode test

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [oauth-flow-demo, webhook-hmac-guard, meta-capi-harness]
    defaults:
      run:
        working-directory: ${{ matrix.project }}/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
