server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/oauth_demo?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:oauth}
    password: ${DB_PASSWORD:oauth_local_only}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  oauth:
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8081/api/oauth/github/callback}
