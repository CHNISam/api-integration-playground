services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: oauth_demo
      MYSQL_USER: ${DB_USER:-oauth}
      MYSQL_PASSWORD: ${DB_PASSWORD:-oauth_local_only}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local_only}
    ports: ["3307:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root_local_only}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["oauth-mysql:/var/lib/mysql"]

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/oauth_demo?allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: ${DB_USER:-oauth}
      DB_PASSWORD: ${DB_PASSWORD:-oauth_local_only}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8081/api/oauth/github/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports: ["8081:8081"]
    depends_on:
      mysql: { condition: service_healthy }

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY: http://backend:8081
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  oauth-mysql:
